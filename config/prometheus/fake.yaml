# Minimal nginx-based fake metrics server for testing PVC autoscaler
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minimal-fake-metrics-server
  namespace: monitoring
  labels:
    app: minimal-fake-metrics-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minimal-fake-metrics-server
  template:
    metadata:
      labels:
        app: minimal-fake-metrics-server
    spec:
      initContainers:
      - name: metrics-verifier
        image: busybox:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for metrics-test-pod..."
          chroot /host kubectl wait --for=condition=Ready --timeout=120s -n pvc-autoscaler-system  pod/pvc-autoscaler-metrics-test-pod --kubeconfig=/etc/kubernetes/admin.conf

          sleep 60
          echo "Starting kubelet_volume_stats_* metrics validation..."
          node_name=$(chroot /host kubectl get nodes -o jsonpath='{.items[0].metadata.name}' --kubeconfig=/etc/kubernetes/admin.conf 2>/dev/null)
          metrics_path="/api/v1/nodes/${node_name}/proxy/metrics"

          output=$(chroot /host kubectl get --raw "${metrics_path}" --kubeconfig=/etc/kubernetes/admin.conf)
          exit_status=$?

          if [ $exit_status -eq 0 ]; then
            echo "Successfully accessed kubelet metrics endpoint"
            if echo "${output}" | grep -q "kubelet_volume_stats_"; then
              echo "kubelet_volume_stats_* metrics found:"
              echo "${output}" | grep "kubelet_volume_stats_"
            else
              echo "kubelet_volume_stats_* metrics NOT found"
              exit 1 # analogy to no lines found in grep
            fi
          else
            echo "Cannot access kubelet metrics endpoint"
            exit $exit_status
          fi
          echo "kubelet_volume_stats_* metrics validation completed"
        volumeMounts:
        - name: host-root
          mountPath: /host
          readOnly: true
        securityContext:
          privileged: true
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 8080
          name: metrics
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: metrics-data
          mountPath: /var/metrics
        - name: scripts
          mountPath: /usr/local/bin/update-metrics.sh
          subPath: update-metrics.sh
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "50m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                # Initialize metrics file with default values
                /usr/local/bin/update-metrics.sh kubelet_volume_stats_available_bytes 1073741824 namespace monitoring persistentvolumeclaim vali-vali-0
                /usr/local/bin/update-metrics.sh kubelet_volume_stats_available_bytes 1073741824 namespace pvc-autoscaler-system persistentvolumeclaim vali-vali-0-test-sts-0
                /usr/local/bin/update-metrics.sh kubelet_volume_stats_available_bytes 4294967296 namespace default persistentvolumeclaim test-pvc-2
                /usr/local/bin/update-metrics.sh kubelet_volume_stats_capacity_bytes 107374182400 namespace monitoring persistentvolumeclaim vali-vali-0
                /usr/local/bin/update-metrics.sh kubelet_volume_stats_capacity_bytes 107374182400 namespace pvc-autoscaler-system persistentvolumeclaim vali-vali-0-test-sts-0
                /usr/local/bin/update-metrics.sh kubelet_volume_stats_capacity_bytes 53687091200 namespace default persistentvolumeclaim test-pvc-2
                /usr/local/bin/update-metrics.sh kubelet_volume_stats_inodes_free 65536 namespace monitoring persistentvolumeclaim vali-vali-0
                /usr/local/bin/update-metrics.sh kubelet_volume_stats_inodes_free 65536 namespace pvc-autoscaler-system persistentvolumeclaim vali-vali-0-test-sts-0
                /usr/local/bin/update-metrics.sh kubelet_volume_stats_inodes_free 262144 namespace default persistentvolumeclaim test-pvc-2
                /usr/local/bin/update-metrics.sh kubelet_volume_stats_inodes 655360 namespace monitoring persistentvolumeclaim vali-vali-0
                /usr/local/bin/update-metrics.sh kubelet_volume_stats_inodes 655360 namespace pvc-autoscaler-system persistentvolumeclaim vali-vali-0-test-sts-0
                /usr/local/bin/update-metrics.sh kubelet_volume_stats_inodes 327680 namespace default persistentvolumeclaim test-pvc-2
      volumes:
      - name: config
        configMap:
          name: minimal-fake-metrics-config
      - name: scripts
        configMap:
          name: minimal-fake-metrics-config
          defaultMode: 0755
      - name: metrics-data
        emptyDir: {}
      - name: host-root
        hostPath:
          path: /
          type: Directory

---
apiVersion: v1
kind: Service
metadata:
  name: minimal-fake-metrics-server
  namespace: monitoring
  annotations:
    networking.resources.monitoringer.cloud/from-all-seed-scrape-targets-allowed-ports: '[{"protocol":"TCP","port":8080}]'
  labels:
    app: minimal-fake-metrics-server
spec:
  selector:
    app: minimal-fake-metrics-server
  ports:
  - port: 8080
    targetPort: 8080
    name: metrics
  type: ClusterIP

---
# ServiceMonitor for minimal fake nginx metrics server
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: minimal-fake-metrics-server
  namespace: monitoring
  labels:
    release: kind-prometheus
    app: minimal-fake-metrics-server
spec:
  selector:
    matchLabels:
      app: minimal-fake-metrics-server
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 30s
    honorLabels: false
    metricRelabelings:
    - sourceLabels: [__name__]
      regex: kubelet_volume_stats_.*
      action: keep
    - sourceLabels: [type]
      regex: fake
      action: keep
    relabelings:
    - targetLabel: instance
      replacement: fake-metrics-server
    - targetLabel: job
      replacement: fake-kubelet-metrics